[package]
name = "zk-cred-vega"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "mdoc credential circuits and mobile bindings on top of Microsoft's vega-prover ZK engine"

[features]
uniffi = ["dep:uniffi"]

[dependencies]
vega-prover = { git = "https://github.com/microsoft/vega-prover.git", rev = "c0ee259053cd12eaf43ed71b5cde375452b3ee4d" }
bellpepper = "0.4.0"
bellpepper-core = "0.4.0"
ff = { version = "0.13.0", features = ["derive"] }
sha2 = "0.10.9"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
uniffi = { version = "0.32.0", optional = true, features = ["cli"] }
anyhow = "1"
bincode = "1.3"
num-bigint = "0.4"
num-traits = "0.2"
halo2curves = "0.10.0"

[dev-dependencies]
hex = "0.4.3"
rand = "0.8"
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = "0.16"
signature = "2.2"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi"]
