[package]
name = "zk-cred-vega"
version = "0.0.2"
edition = "2024"
license = "BSD-2-Clause"
description = "mdoc credential circuits and mobile bindings on top of Microsoft's vega-prover ZK engine"

[features]
uniffi = ["dep:uniffi"]

[dependencies]
# Forked from microsoft/vega-prover@c0ee259 (the previously-pinned rev) to
# add #[serde(skip)] on VegaMcPrepZkSNARK's cached_step_matvec/cached_step_i64
# fields - deterministic performance caches (prove() already recomputes them
# when None) that otherwise account for ~70% of a serialized prep-state's
# size, too large to cross a mobile wallet's FFI boundary into a single JVM
# byte[] within Android's heap ceiling. Upstream PR planned once verified on
# real hardware - see this repo's own commit history for the exact diff.
vega-prover = { git = "https://github.com/sirosfoundation/vega-prover.git", rev = "15fa721" }
bellpepper = "0.4.0"
bellpepper-core = "0.4.0"
ff = { version = "0.13.0", features = ["derive"] }
sha2 = { version = "0.10.9", features = ["compress"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
uniffi = { version = "0.32.0", optional = true, features = ["cli"] }
anyhow = "1"
bincode = "1.3"
num-bigint = "0.4"
num-traits = "0.2"
halo2curves = "0.10.0"
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = "0.16"
signature = "2.2"

[dev-dependencies]
hex = "0.4.3"
rand = "0.8"
serde_json = "1.0"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi"]
